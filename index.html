<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100e">
<meta name="description" content="KumiChat — sizning shaxsiy AI yordamchingiz">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>KumiChat — AI Yordamchi</title>
<style>
  :root{
    --bg: #14100e;
    --panel: #1c1714;
    --panel-2: #241d19;
    --accent: #ff7a3d;
    --accent-2: #ffb37a;
    --text: #f2ece6;
    --text-dim: #a89a8f;
    --border: #332922;
    --user-bubble: #2c2420;
    --ai-bubble: #201a16;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overscroll-behavior: none;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 820px;
    margin: 0 auto;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  .header {
    padding: 16px 20px;
    padding-top: max(16px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(180deg, var(--panel), var(--bg));
    flex-shrink: 0;
  }
  .logo {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #1a1210; font-size: 15px;
    flex-shrink: 0;
  }
  .header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: 0.2px; }
  .header p { margin: 2px 0 0; font-size: 12px; color: var(--text-dim); }

  .messages {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    max-width: 320px;
    padding: 0 16px;
  }
  .empty-state .logo { margin: 0 auto 14px; width: 44px; height: 44px; font-size: 19px; }
  .empty-state h2 { color: var(--text); font-size: 17px; margin: 0 0 8px; }
  .empty-state p { font-size: 13px; line-height: 1.5; margin: 0; }

  .msg-row { display: flex; gap: 10px; max-width: 100%; }
  .msg-row.user { flex-direction: row-reverse; }
  .avatar {
    width: 28px; height: 28px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .avatar.ai { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #1a1210; }
  .avatar.user { background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--border); }

  .bubble {
    padding: 11px 15px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.55;
    max-width: 78%;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg-row.ai .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg-row.user .bubble { background: var(--user-bubble); border-top-right-radius: 4px; }

  .typing { display: flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-2);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .input-area {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    background: var(--bg);
    flex-shrink: 0;
  }
  .input-box {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px 8px 8px 16px;
    transition: border-color 0.15s;
  }
  .input-box:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    line-height: 1.5;
    max-height: 140px;
    padding: 8px 0;
  }
  textarea::placeholder { color: var(--text-dim); }
  .send-btn {
    width: 38px; height: 38px;
    border-radius: 11px;
    border: none;
    background: var(--accent);
    color: #1a1210;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, opacity 0.15s;
  }
  .send-btn:hover:not(:disabled) { background: var(--accent-2); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .hint { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 8px; }

  .install-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    margin: 10px 16px 0;
    font-size: 12.5px;
  }
  .install-banner.show { display: flex; }
  .install-banner button {
    background: var(--accent);
    color: #1a1210;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="logo">K</div>
    <div>
      <h1>KumiChat</h1>
      <p>Sizning AI yordamchingiz</p>
    </div>
  </div>

  <div class="install-banner" id="installBanner">
    <span>Ilovani telefoningizga o'rnating</span>
    <button id="installBtn">O'rnatish</button>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="logo">K</div>
      <h2>Nima bilan yordam beray?</h2>
      <p>Savolingizni yozing — dasturlash, uy vazifasi yoki umuman istalgan mavzuda so'rashingiz mumkin.</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea id="input" placeholder="Xabar yozing..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" aria-label="Yuborish">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <div class="hint">KumiChat xato qilishi mumkin. Muhim ma'lumotlarni tekshirib ko'ring.</div>
  </div>
</div>

<script>
  // ====== SIZNING GEMINI API KEY'INGIZNI SHU YERGA QO'YING ======
  const GEMINI_API_KEY = "SIZNING_API_KEYINGIZ_BU_YERGA";
  // ================================================================

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const emptyState = document.getElementById('emptyState');

  let history = [];
  let isLoading = false;

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  function addBubble(role, text) {
    if (emptyState) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'avatar ' + role;
    avatar.textContent = role === 'ai' ? 'K' : 'S';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    row.id = 'typingRow';
    const avatar = document.createElement('div');
    avatar.className = 'avatar ai';
    avatar.textContent = 'K';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isLoading) return;

    if (!GEMINI_API_KEY || GEMINI_API_KEY === "SIZNING_API_KEYINGIZ_BU_YERGA") {
      addBubble('ai', "API key hali kiritilmagan. Kod ichidagi GEMINI_API_KEY qatoriga o'z key'ingizni qo'ying.");
      return;
    }

    isLoading = true;
    sendBtn.disabled = true;
    addBubble('user', text);
    history.push({ role: 'user', parts: [{ text: text }] });
    inputEl.value = '';
    inputEl.style.height = 'auto';
    addTyping();

    try {
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: history,
            systemInstruction: {
              parts: [{ text: "Sen KumiChat nomli AI yordamchisan. Har doim faqat o'zbek tilida javob ber, foydalanuvchi boshqa tilda yozsa ham. Javoblaring aniq, tushunarli va do'stona bo'lsin." }]
            }
          })
        }
      );
      const data = await response.json();

      if (data.error) {
        throw new Error(data.error.message || "Noma'lum xatolik");
      }

      const reply = data.candidates?.[0]?.content?.parts?.map(p => p.text).join("\n") || "Kechirasiz, javob olishda xatolik yuz berdi.";

      removeTyping();
      addBubble('ai', reply);
      history.push({ role: 'model', parts: [{ text: reply }] });
    } catch (err) {
      removeTyping();
      addBubble('ai', "Xatolik yuz berdi: " + err.message);
    } finally {
      isLoading = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // ====== PWA: Service Worker ro'yxatdan o'tkazish ======
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW xatosi:', err));
    });
  }

  // ====== PWA: O'rnatish tugmasi ======
  let deferredPrompt;
  const installBanner = document.getElementById('installBanner');
  const installBtn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBanner.classList.add('show');
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBanner.classList.remove('show');
  });

  window.addEventListener('appinstalled', () => {
    installBanner.classList.remove('show');
  });
</script>

</body>
</html>
